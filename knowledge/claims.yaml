# Claims registry.
#
# Each claim is a quantified, attributable statement taken from an indexed
# source. The reasoning engine attaches claim_ids to a recommendation; the
# retrieval layer then pulls the supporting passage from the declared sources
# using `retrieval_query`. If retrieval returns nothing for a claim, the claim
# is dropped and the recommendation's confidence is downgraded.
#
# Nothing in this file is generated by a language model. Every number is
# reproduced from the named source.
#
# magnitude  : the effect exactly as the source reports it
# direction  : increase | decrease | stabilise
# horizon    : short (0-2y) | medium (2-5y) | long (5y+)
# strength   : high (meta-analysis / major assessment) | moderate | synthesis

claims:

  # ---------------- Cover crops -----------------------------------------
  - id: cc_soc_rate
    statement: "Cover crops in arable rotations increase soil organic carbon at a mean rate of 0.32 +/- 0.08 Mg C per hectare per year over a 22 cm depth, with no saturation observed within the study period."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "+0.32 +/- 0.08 Mg C/ha/yr (0-22 cm)"
    horizon: medium
    sources: [poeplau_don_2015]
    retrieval_query: "cover crops annual soil organic carbon sequestration rate Mg per hectare meta-analysis"
    strength: high

  - id: cc_soc_texture
    statement: "The SOC response to cover cropping is strongly texture-dependent: fine-textured soils gained 39.5% on average, medium-textured 10.3% and coarse-textured 11.4%; the global mean rate across studies was 0.56 Mg per hectare per year."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "+39.5% fine-textured, +10-11% medium/coarse; mean 0.56 Mg/ha/yr"
    horizon: medium
    sources: [jian_2020]
    retrieval_query: "soil texture fine-textured clay content controls cover crop soil carbon response percent"
    strength: high

  - id: cc_runoff_erosion
    statement: "Cover-crop-driven increases in SOC were correlated with decreased runoff and erosion and with increased mineralisable carbon, mineralisable nitrogen and total soil nitrogen."
    metric: soil_moisture
    direction: increase
    magnitude: "reduced runoff and erosion; increased mineralisable C and N"
    horizon: short
    sources: [jian_2020]
    retrieval_query: "cover crops decreased runoff erosion increased mineralisable nitrogen soil quality"
    strength: high

  - id: cc_biodiversity
    statement: "Cover crops are associated with 21% higher associated biodiversity (CI 17-25%) relative to undiversified systems."
    metric: species_richness
    direction: increase
    magnitude: "+21% (CI 17-25%) associated biodiversity"
    horizon: medium
    sources: [beillouin_2021]
    retrieval_query: "cover crops percent higher biodiversity levels diversification strategies confidence interval"
    strength: high

  # ---------------- Agroforestry ----------------------------------------
  - id: af_biodiversity
    statement: "Agroforestry systems host 61% higher associated biodiversity (CI 25-105%) than monoculture systems, the largest effect of any crop diversification strategy assessed."
    metric: species_richness
    direction: increase
    magnitude: "+61% (CI 25-105%) associated biodiversity"
    horizon: long
    sources: [beillouin_2021]
    retrieval_query: "agroforestry systems higher biodiversity levels than monocultures percent most effective strategy"
    strength: high

  - id: af_soc_cropland
    statement: "Agroforestry significantly increased soil organic carbon in croplands by 20% (CI +17 to +23%) relative to cropland controls."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "+20% SOC (CI +17 to +23%) vs cropland"
    horizon: long
    sources: [beillouin_2023_soc]
    retrieval_query: "agroforestry significantly increased soil organic carbon croplands percent confidence interval"
    strength: high

  - id: af_landuse_buffer
    statement: "Where forest is converted to cropland, SOC loss is about 32% under annual crops but only about 12% where the converted land is under agroforestry, so retaining woody perennial cover avoids roughly two-thirds of the carbon penalty."
    metric: deforestation
    direction: stabilise
    magnitude: "-12% SOC under agroforestry vs -32% under annual crops after forest conversion"
    horizon: long
    sources: [beillouin_2023_soc]
    retrieval_query: "forest conversion cropland soil organic carbon loss annual crops agroforestry perennial percent"
    strength: high

  - id: af_runoff_yield
    statement: "Across more than 1,100 observations in sub-Saharan Africa, agroforestry significantly increased crop yield, soil organic carbon and total soil nitrogen while decreasing runoff and soil loss relative to non-agroforestry controls."
    metric: soil_moisture
    direction: increase
    magnitude: "reduced runoff and soil loss; increased yield, SOC and total N"
    horizon: medium
    sources: [kuyah_2019]
    retrieval_query: "agroforestry increased crop yield soil organic carbon decreased runoff soil loss sub-Saharan Africa"
    strength: high

  - id: af_arid_response
    statement: "Soil organic carbon responses to agroforestry are largest in arid zones, and agroforestry raises soil microbial biomass and diversity relative to monoculture."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "largest proportional SOC response in arid zones; higher microbial biomass and diversity"
    horizon: long
    sources: [kuyah_2019]
    retrieval_query: "agroforestry soil organic carbon largest response arid zones microbial biomass diversity monoculture"
    strength: moderate

  - id: af_microclimate
    statement: "Vegetation canopy reduces maximum surface temperature and vapour pressure deficit beneath it, creating microclimatic refugia that allow species to persist under regional warming."
    metric: temperature
    direction: decrease
    magnitude: "reduced peak surface temperature and evaporative demand beneath canopy"
    horizon: medium
    sources: [ipcc_ar6_wg2_2022, mechanism_notes]
    retrieval_query: "canopy cover reduces maximum surface temperature vapour pressure deficit microclimate buffering refugia"
    strength: high

  # ---------------- Rotation and diversification ------------------------
  - id: rotation_biodiversity
    statement: "Crop rotation is associated with 37% higher associated biodiversity (CI 16-62%) compared with undiversified systems."
    metric: species_richness
    direction: increase
    magnitude: "+37% (CI 16-62%) associated biodiversity"
    horizon: medium
    sources: [beillouin_2021]
    retrieval_query: "crop rotations percent higher biodiversity levels meta-analysis confidence interval"
    strength: high

  - id: diversification_overall
    statement: "Crop diversification raises associated biodiversity by a median of 24% (CI 15-33%), crop production by 14%, water quality by 51%, pest and disease control by 63% and soil quality by 11%."
    metric: species_richness
    direction: increase
    magnitude: "+24% biodiversity (CI 15-33%), +11% soil quality, +63% pest control, +14% yield"
    horizon: medium
    sources: [beillouin_2021]
    retrieval_query: "crop diversification median effect associated biodiversity water quality pest disease control soil quality percent"
    strength: high

  - id: intercropping_biodiversity
    statement: "Intercropping delivers a comparatively small biodiversity gain of 7% (CI 3-12%), well below agroforestry or rotation, because it adds within-season crop diversity without adding structural habitat."
    metric: species_richness
    direction: increase
    magnitude: "+7% (CI 3-12%) associated biodiversity"
    horizon: short
    sources: [beillouin_2021]
    retrieval_query: "intercropping higher biodiversity percent multiple crops grown simultaneously"
    strength: high

  # ---------------- Field margins, flower strips, hedgerows -------------
  - id: fs_pest_control
    statement: "Flower strips enhanced pest control services in adjacent fields by 16% on average, whereas hedgerows showed no significant pest control effect in the same synthesis."
    metric: pest_control_service
    direction: increase
    magnitude: "+16% pest control service from flower strips"
    horizon: short
    sources: [albrecht_2020]
    retrieval_query: "flower strips enhanced pest control services adjacent fields percent hedgerows"
    strength: high

  - id: fs_distance_decay
    statement: "Pollination services decline exponentially with distance from field-edge plantings, and perennial, older, more floristically diverse strips enhance pollination more effectively than young or species-poor ones."
    metric: habitat_diversity
    direction: increase
    magnitude: "benefit concentrated near the margin; increases with strip age and floral diversity"
    horizon: medium
    sources: [albrecht_2020]
    retrieval_query: "pollination services declined exponentially distance from plantings perennial older flower strips diversity"
    strength: high

  - id: fs_edge_not_spillover
    statement: "Field-margin floral enhancements reliably increase pollinator abundance and richness at the field edge, but show no consistent spillover of pollinators into the crop interior."
    metric: species_richness
    direction: increase
    magnitude: "consistent richness gain at field edge; in-field spillover not consistent"
    horizon: short
    sources: [albrecht_2020]
    retrieval_query: "field margin floral enhancements pollinator diversity field edge no consistent spillover crop"
    strength: high

  - id: semi_natural_threshold
    statement: "Positive effects of diversification on biodiversity strengthen once semi-natural vegetation exceeds roughly 10% of the landscape and are strongest up to about 20%, consistent with the intermediate landscape complexity hypothesis."
    metric: habitat_diversity
    direction: increase
    magnitude: "benefits strongest where semi-natural vegetation is ~10-20% of landscape"
    horizon: long
    sources: [albrecht_2020]
    retrieval_query: "semi-natural vegetation exceeds 10 percent landscape intermediate landscape complexity hypothesis biodiversity"
    strength: moderate

  - id: pollinator_nesting
    statement: "Many wild bee species nest in bare ground, dead wood or hollow stems, and nesting substrate availability can limit populations independently of floral resource supply."
    metric: species_richness
    direction: increase
    magnitude: "nesting substrate is an independent limiting factor alongside forage"
    horizon: medium
    sources: [ipbes_pollinators_2016]
    retrieval_query: "wild bees nest bare ground dead wood hollow stems nesting substrate limiting populations"
    strength: high

  - id: forage_continuity
    statement: "Continuity of floral resources through the season matters as much as total quantity; a landscape with a short intense bloom and a long resource gap supports fewer pollinators than one with continuous flowering."
    metric: species_richness
    direction: increase
    magnitude: "season-long forage continuity required, not peak abundance alone"
    horizon: medium
    sources: [ipbes_pollinators_2016]
    retrieval_query: "diversity continuity floral resources through season effective responses pollinators"
    strength: high

  # ---------------- Pollution -------------------------------------------
  - id: pesticide_sublethal
    statement: "Insecticides have lethal and sub-lethal effects on pollinators under field-realistic conditions, impairing foraging, navigation and reproduction; herbicides act indirectly by removing flowering weeds that supply forage."
    metric: pollution
    direction: decrease
    magnitude: "sub-lethal impairment of foraging, navigation and reproduction"
    horizon: short
    sources: [ipbes_pollinators_2016]
    retrieval_query: "pesticides insecticides lethal sub-lethal effects pollinators foraging navigation reproduction herbicides forage"
    strength: high

  - id: pollution_caps_habitat
    statement: "Chemical pressure acts multiplicatively with habitat quality: habitat created within a heavily treated matrix can function as an ecological trap, so reducing exposure is a precondition for habitat interventions to deliver their expected effect."
    metric: pollution
    direction: decrease
    magnitude: "habitat gains are capped until chemical exposure is reduced"
    horizon: short
    sources: [mechanism_notes, ipbes_2019]
    retrieval_query: "pollution capping constraint ecological trap habitat heavily treated matrix reducing exposure precondition"
    strength: synthesis

  - id: pollution_driver_rank
    statement: "IPBES ranks the direct drivers of terrestrial biodiversity loss as land- and sea-use change first, then direct exploitation, climate change, pollution and invasive alien species."
    metric: pollution
    direction: decrease
    magnitude: "pollution ranked 4th of 5 global direct drivers; land-use change ranked 1st"
    horizon: long
    sources: [ipbes_2019]
    retrieval_query: "direct drivers biodiversity loss ranking land use change exploitation climate change pollution invasive species"
    strength: high

  # ---------------- Soil pH ---------------------------------------------
  - id: ph_gates_legumes
    statement: "Below roughly pH 5.5 aluminium becomes soluble and toxic to root meristems, phosphorus is fixed, and rhizobial symbiosis is impaired, so legume-dependent interventions under-deliver until pH is corrected."
    metric: soil_ph
    direction: increase
    magnitude: "legume nitrogen fixation impaired below pH 5.5"
    horizon: short
    sources: [fao_swsr_2015, fao_soil_desc_2006, mechanism_notes]
    retrieval_query: "below pH 5.5 aluminium soluble toxic roots phosphorus fixed rhizobial symbiosis impaired legume"
    strength: high

  - id: ph_alkaline_micronutrients
    statement: "Above about pH 7.5, iron, manganese and zinc availability declines and phosphorus is fixed by calcium, producing chlorosis on calcareous soils; strongly alkaline soils often indicate sodicity with dispersed clay and poor infiltration."
    metric: soil_ph
    direction: stabilise
    magnitude: "micronutrient availability declines above pH 7.5; sodicity risk above 8.5"
    horizon: medium
    sources: [fao_soil_desc_2006, fao_swsr_2015]
    retrieval_query: "micronutrient cations iron manganese zinc less available pH rises alkaline calcareous chlorosis sodicity"
    strength: high

  - id: legume_nitrogen_efficiency
    statement: "Nitrogen supply frequently limits the conversion of added carbon into stabilised soil organic matter, so including legumes raises the efficiency with which biomass becomes durable soil carbon."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "legume N raises stabilisation efficiency of added carbon"
    horizon: medium
    sources: [fao_recsoil_2021]
    retrieval_query: "legumes biologically fixed nitrogen carbon nitrogen ratio stabilised soil organic matter efficiency nodulation"
    strength: high

  # ---------------- Water and drylands ----------------------------------
  - id: dryland_water_first
    statement: "In arid and semi-arid systems the biomass that can be produced is water-limited, which caps achievable carbon input; practices should therefore prioritise water capture and retention first, with carbon accumulation following the resulting biomass increase."
    metric: soil_moisture
    direction: increase
    magnitude: "water capture precedes and enables carbon accumulation in drylands"
    horizon: short
    sources: [fao_recsoil_2021]
    retrieval_query: "arid semi-arid biomass water-limited caps carbon input prioritise water capture retention harvesting planting pits"
    strength: high

  - id: residue_water_conservation
    statement: "Continuous soil cover reduces raindrop impact, surface sealing and erosion, lowers soil surface temperature and reduces evaporative loss; in warm dry environments this water conservation effect is typically the dominant short-term benefit, preceding any measurable SOC change."
    metric: soil_moisture
    direction: increase
    magnitude: "reduced evaporation and surface sealing; dominant short-term benefit in warm dry systems"
    horizon: short
    sources: [fao_recsoil_2021]
    retrieval_query: "maintaining continuous soil cover reduces raindrop impact surface sealing evaporative loss residue warm dry"
    strength: high

  - id: soc_water_holding
    statement: "Organic matter raises plant-available water capacity mainly by promoting aggregation, so raising soil organic carbon partially substitutes for rainfall by increasing the share of each event retained in the profile rather than lost to runoff and evaporation."
    metric: soil_moisture
    direction: increase
    magnitude: "higher plant-available water capacity via improved aggregation"
    horizon: medium
    sources: [mechanism_notes, fao_swsr_2015]
    retrieval_query: "organic matter increases plant available water capacity aggregation partially substitutes rainfall runoff"
    strength: synthesis

  - id: drought_species_loss
    statement: "Increased drought frequency and intensity has driven tree mortality and vegetation dieback; in water-limited systems species without access to persistent moisture are lost first, shifting communities toward drought-tolerant taxa and reducing richness."
    metric: species_richness
    direction: decrease
    magnitude: "richness declines as dry spells lengthen in water-limited systems"
    horizon: long
    sources: [ipcc_ar6_wg2_2022]
    retrieval_query: "drought frequency intensity tree mortality vegetation dieback water availability species persistence richness"
    strength: high

  # ---------------- Temperature and permanence --------------------------
  - id: warming_mineralisation
    statement: "Warming accelerates decomposition of soil organic matter, so in warm and hot climates a given biomass input is mineralised faster and sustained annual inputs are required to hold a raised carbon stock."
    metric: soil_organic_carbon
    direction: stabilise
    magnitude: "faster mineralisation in warm climates; sustained input needed to retain gains"
    horizon: long
    sources: [ipcc_srccl_2019, mechanism_notes]
    retrieval_query: "warming accelerates decomposition soil organic matter warm hot climates mineralised rapidly sustained inputs"
    strength: high

  - id: soc_reversibility
    statement: "SOC gains are reversible: carbon accumulated over a decade can be substantially lost within a few seasons if tillage resumes, residues are removed or cover is lost, so continuity of management is required to retain the benefit."
    metric: soil_organic_carbon
    direction: stabilise
    magnitude: "gains reversible within a few seasons if management lapses"
    horizon: long
    sources: [fao_recsoil_2021]
    retrieval_query: "SOC gains reversible tillage resumed residues removed vegetation cover lost continuity management"
    strength: high

  - id: soc_monitoring_lag
    statement: "Detecting SOC change against high spatial variability typically requires several years and a consistent protocol, so short-term monitoring should track faster-responding proxies such as aggregate stability, infiltration rate, earthworm counts or mineralisable carbon."
    metric: soil_organic_carbon
    direction: stabilise
    magnitude: "several years to detect SOC change; use faster proxies for early monitoring"
    horizon: short
    sources: [fao_recsoil_2021]
    retrieval_query: "detecting change soil organic carbon spatial variability sampling protocol proxy indicators aggregate stability earthworm"
    strength: high

  # ---------------- Habitat structure, connectivity ---------------------
  - id: fragmentation_connectivity
    statement: "Small isolated patches support fewer species than the same total area held in connected units because local extinctions are not offset by recolonisation, so restoring connectivity is a distinct intervention from increasing habitat area."
    metric: habitat_diversity
    direction: increase
    magnitude: "connectivity and area act as separate, non-substitutable variables"
    horizon: long
    sources: [ipbes_2019, mechanism_notes]
    retrieval_query: "habitat fragmentation small isolated patches fewer species recolonisation restoring connectivity distinct intervention"
    strength: high

  - id: connectivity_climate_tracking
    statement: "Fragmented populations are less able to track shifting climate envelopes because dispersal routes are absent, so habitat connectivity determines whether species can respond to climate change at all."
    metric: habitat_diversity
    direction: increase
    magnitude: "connectivity is a precondition for climate-driven range tracking"
    horizon: long
    sources: [ipcc_ar6_wg2_2022]
    retrieval_query: "fragmented population less able track shifting climate envelope dispersal routes absent connectivity"
    strength: high

  - id: landuse_first_driver
    statement: "Land-use change is the highest-ranked direct driver of terrestrial biodiversity loss globally, and three-quarters of the terrestrial environment has been significantly altered by human actions."
    metric: land_use
    direction: stabilise
    magnitude: "land-use change ranked 1st driver; ~75% of land significantly altered"
    horizon: long
    sources: [ipbes_2019]
    retrieval_query: "land use change first ranked driver three quarters terrestrial environment significantly altered"
    strength: high

  # ---------------- Soil biology ----------------------------------------
  - id: soc_soil_biodiversity
    statement: "Soil organic matter is the energy substrate of the soil food web, so carbon-depleted soils support reduced and less diverse soil communities; because those organisms mediate mineralisation and aggregate formation, the relationship is self-reinforcing in both directions."
    metric: species_richness
    direction: increase
    magnitude: "soil community size and diversity limited by carbon supply"
    horizon: medium
    sources: [fao_swsr_2015, mechanism_notes]
    retrieval_query: "soil organic matter energy substrate soil food web microbial biomass fauna carbon supply nutrient cycling"
    strength: high

  - id: soil_threat_soc_loss
    statement: "FAO and ITPS identify loss of soil organic carbon as one of the most significant and widespread global soil threats, degrading physical, chemical and biological soil function simultaneously."
    metric: soil_organic_carbon
    direction: increase
    magnitude: "SOC loss identified as a principal global soil threat"
    horizon: long
    sources: [fao_swsr_2015]
    retrieval_query: "principal soil threats erosion loss soil organic carbon nutrient imbalance acidification significant widespread"
    strength: high

  # ---------------- Land degradation and restoration --------------------
  - id: degradation_productivity
    statement: "Land degradation has reduced the productivity of 23% of the global land surface, and between US$235 billion and US$577 billion in annual global crop output is at risk from pollinator loss."
    metric: land_use
    direction: increase
    magnitude: "23% of global land surface degraded in productivity terms"
    horizon: long
    sources: [ipbes_2019]
    retrieval_query: "land degradation reduced productivity 23 percent global land surface crop output risk pollinator loss"
    strength: high

  - id: srccl_cobenefit_options
    statement: "IPCC identifies increased soil organic carbon content, agroforestry and reduced deforestation and degradation among land management options delivering co-benefits across mitigation, adaptation, desertification and food security with limited adverse side effects at appropriate scales."
    metric: land_use
    direction: increase
    magnitude: "co-benefits across mitigation, adaptation, desertification and food security"
    horizon: long
    sources: [ipcc_srccl_2019]
    retrieval_query: "response options increased soil organic carbon agroforestry reduced deforestation co-benefits mitigation adaptation food security"
    strength: high

  - id: erosion_exceeds_formation
    statement: "Soil erosion from agricultural fields is estimated to be substantially greater than soil formation rates, so on conventionally tilled cropland soil is lost far faster than it is replaced; maintaining continuous ground cover, not only reduced tillage, is required to reverse this."
    metric: land_use
    direction: stabilise
    magnitude: "erosion rates exceed soil formation rates on tilled cropland"
    horizon: long
    sources: [ipcc_srccl_2019]
    retrieval_query: "soil erosion agricultural fields greater than soil formation rates continuous ground cover tillage"
    strength: high
